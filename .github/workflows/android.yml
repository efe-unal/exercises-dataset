# Builds the two Android apps — athlete and operator — as installable APKs.
#
# Runs on GitHub's machines because they already carry the Android SDK, which
# nobody then has to install locally. Each run leaves the two APKs on the run's
# page under "Artifacts"; download, unzip, and open the .apk on a phone.
#
# These are debug builds: installable by anyone who allows "unknown sources",
# signed with a throwaway key, and not accepted by the Play Store. That is what
# a test build should be. A store build needs a real signing key, kept as a
# repository secret — a separate step, taken once the app is ready for it.
#
# The server address is read from, in order: the address typed when starting
# the run by hand, the repository variable API_URL, and a placeholder. A build
# with the placeholder installs and opens but cannot sign anyone in.

name: Android APKs

on:
  push:
    branches: [main, 'claude/**']
    paths:
      - 'web/**'
      - 'packages/**'
      - 'package-lock.json'
      - '.github/workflows/android.yml'
  workflow_dispatch:
    inputs:
      api_url:
        description: 'API address, https://… (empty: the API_URL variable)'
        required: false

permissions:
  contents: read

jobs:
  apk:
    name: ${{ matrix.app }} APK
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [athlete, operator]
    env:
      VITE_API_URL: ${{ inputs.api_url || vars.API_URL || 'https://api.example.com' }}
      VITE_PUBLIC_URL: ${{ vars.PUBLIC_URL }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Warn when no server address is set
        if: env.VITE_API_URL == 'https://api.example.com'
        run: >
          echo "::warning::No API_URL set — this APK opens but cannot reach a
          server. Set the repository variable API_URL, or type the address
          when starting the run by hand."

      - run: npm ci
      - run: npm run build --workspace @exercises/api-client

      - name: Build the web content into the Android shell
        working-directory: web
        run: node scripts/build-android.mjs ${{ matrix.app }}

      - name: Build the APK
        working-directory: web/android-${{ matrix.app }}
        run: ./gradlew assembleDebug --no-daemon

      - name: Name the APK after its app
        run: >
          mv web/android-${{ matrix.app }}/app/build/outputs/apk/debug/app-debug.apk
          antrenman-${{ matrix.app }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: antrenman-${{ matrix.app }}
          path: antrenman-${{ matrix.app }}.apk
          retention-days: 30
